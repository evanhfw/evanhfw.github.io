---
layout: default
title: Terminal
---
<h2>💻 /terminal</h2>
<p>Mini-shell buat jelajah situs ini. Ketik <code>help</code> untuk daftar perintah.</p>

<div id="term">
  <div id="term-out" aria-live="polite"></div>
  <div id="term-line"><span class="prompt">evan@my-name-is:~$</span> <input id="term-in" autocomplete="off" spellcheck="false" /></div>
</div>

<style>
#term { background: rgba(18,20,23,.94); color: #d7dde5; border: 1px solid rgba(128,128,128,.4); border-radius: 8px; padding: 14px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; cursor: text; }
#term-out { white-space: pre; overflow-x: auto; line-height: 1.55; }
#term-out a { color: #6cb6e0; }
#term-out .cmd { color: #8fd3ff; }
#term-out .err { color: #ff9c9c; }
#term-out .dim { color: #8b949e; }
#term-line { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.prompt { color: #7fd18c; white-space: nowrap; }
#term-in { flex: 1; background: transparent; border: none; outline: none; color: inherit; font: inherit; padding: 2px 0; caret-color: #7fd18c; }
</style>

<script>
(() => {
  const term = document.getElementById('term');
  const out = document.getElementById('term-out');
  const input = document.getElementById('term-in');
  const cmdHist = [];
  let hi = -1;

  const w = (html) => { const d = document.createElement('div'); d.innerHTML = html; out.appendChild(d); };
  const wt = (text, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); };

  const pages = {
    home:  { url: '/',                desc: 'profil, pengalaman, proyek, blog' },
    blog:  { url: '/blog/',           desc: 'tulisan teknis (self-hosting, CV, dsb.)' },
    certs: { url: '/certifications/', desc: 'daftar lengkap sertifikasi' },
    chat:  { url: '/chat/',           desc: 'tanya AI soal Evan' },
    lab:   { url: '/lab/',            desc: 'status live homelab ini' },
    uses:  { url: '/uses/',           desc: 'hardware & software yang dipakai' },
  };

  const P = (t) => `<span class="dim">${t}</span>`;

  const commands = {
    help: () => w(
      'Perintah yang tersedia:\n' +
      '  help            bantuan ini\n' +
      '  whoami          siapa pemilik situs ini\n' +
      '  about           ringkasan singkat\n' +
      '  experience      pengalaman kerja\n' +
      '  projects        proyek pilihan\n' +
      '  skills          skill utama\n' +
      '  contact         kontak\n' +
      '  ls              daftar halaman situs\n' +
      '  cat &lt;halaman&gt;   ringkasan halaman\n' +
      '  open &lt;halaman&gt;  buka halaman\n' +
      '  neofetch        info "sistem"\n' +
      '  clear           bersihkan layar'),
    whoami: () => w('evan — AI Engineer\nComputer Vision · ML · Backend · Surakarta, Indonesia\n' + P('“Every day you may make progress.”')),
    about: () => w(
      'AI Engineer di rubythalib.ai, ditempatkan ke Sinarmas\n' +
      'Mining / PT Borneo Indobara untuk sistem AI produksi\n' +
      'di operasi keselamatan tambang.\n' +
      'Face recognition 0% → 97% · OCR plat 60% → 94%\n' +
      'RAM Jetson 24GB → 8GB'),
    experience: () => w(
      'AI Engineer        rubythalib.ai     May 2026 – now\n' +
      'AI Engineer Intern rubythalib.ai     Oct 2025 – Apr 2026\n' +
      'Research Assistant UNS Surakarta     Dec 2024 – Jul 2026\n' +
      'CV Engineer Intern DataIns           Dec 2024 – Apr 2025'),
    projects: () => w(
      'hireonai.web.id  portal kerja AI (founder)\n' +
      'dicodex          dashboard bootcamp (1.000+ users)\n' +
      'visionai         platform CCTV (clean architecture)\n' +
      'homelab          infra self-hosted (situs ini dari sini)'),
    skills: () => w(
      'ML & Data      Python · Computer Vision · YOLO ·\n' +
      '               DeepFace · XGBoost · Time Series ·\n' +
      '               LLM & RAG · ChromaDB\n' +
      'Backend/Infra  FastAPI · Go · Node.js · Docker ·\n' +
      '               Linux · PostgreSQL/MySQL · CI/CD · GCP'),
    contact: () => w('email      <a href="mailto:evan.hanif.w@gmail.com">evan.hanif.w@gmail.com</a>\n' +
                     'linkedin   <a href="https://www.linkedin.com/in/evanhanif/" target="_blank" rel="noopener">linkedin.com/in/evanhanif</a>\n' +
                     'github     <a href="https://github.com/evanhfw" target="_blank" rel="noopener">github.com/evanhfw</a>'),
    ls: () => w(Object.entries(pages).map(([k, v]) => `  ${k.padEnd(9)} ${v.desc}`).join('\n')),
    cat: (arg) => {
      const p = pages[arg];
      return p ? w(`${arg}/  — ${p.desc}\n` + `buka dengan: open ${arg}`) : w(`tidak ada halaman "${arg}" — coba: ls`, 'err');
    },
    open: (arg) => {
      const p = pages[arg];
      if (p) { wt(`membuka ${p.url} …`, 'dim'); setTimeout(() => { location.href = p.url; }, 350); }
      else w(`tidak ada halaman "${arg}" — coba: ls`, 'err');
    },
    neofetch: () => w(
      '    .---.      evan@my-name-is\n' +
      '   / o o \\     -----------------------\n' +
      '   \\ _^_ /     host    : my-name-is.evanhfw.my.id\n' +
      '    `---`      engine  : Jekyll + nginx (self-hosted)\n' +
      '               shell   : mini-shell v1\n' +
      '               uptime  : lihat /lab\n' +
      '               memory  : Honcho + Umami + lainnya'),
    sudo: () => w('Nice try. 😄 ' + P('kamu bukan root di sini')),
    exit: () => w('Tidak bisa keluar dari sini — tapi bisa kok ke ' + '<a href="/">/</a>.'),
    ping: () => w('pong'),
    clear: () => { out.innerHTML = ''; },
  };

  function run(raw) {
    const line = raw.trim();
    wt('evan@my-name-is:~$ ' + line, 'cmd');
    if (!line) return;
    const [cmd, ...rest] = line.split(/\s+/);
    const fn = commands[cmd.toLowerCase()];
    if (fn) { fn(rest.join(' ').toLowerCase()); }
    else { wt(`perintah tidak dikenal: ${cmd} — ketik help`, 'err'); }
    out.lastElementChild?.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = input.value;
      if (v.trim()) { cmdHist.push(v); hi = cmdHist.length; }
      run(v);
      input.value = '';
    } else if (e.key === 'ArrowUp') {
      if (hi > 0) { hi--; input.value = cmdHist[hi] || ''; e.preventDefault(); }
    } else if (e.key === 'ArrowDown') {
      if (hi < cmdHist.length - 1) { hi++; input.value = cmdHist[hi] || ''; }
      else { hi = cmdHist.length; input.value = ''; }
      e.preventDefault();
    }
  });
  term.addEventListener('click', () => input.focus());

  w('<span class="dim">mini-shell siap. Ketik `help` untuk mulai.</span>');
  input.focus();
})();
</script>
