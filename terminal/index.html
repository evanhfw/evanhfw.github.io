---
layout: default
title: Terminal
---
<h2>💻 /terminal</h2>
<p>A mini-shell to explore this site. Type <code>help</code> for the command list.</p>

<div id="term">
  <div id="term-out" aria-live="polite"></div>
  <div id="term-line"><span class="prompt">evan@hello:~$</span> <input id="term-in" autocomplete="off" spellcheck="false" /></div>
</div>

<style>
#term { background: rgba(18,20,23,.94); color: #d7dde5; border: 1px solid rgba(128,128,128,.4); border-radius: 8px; padding: 14px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; cursor: text; }
#term-out { white-space: pre; overflow-x: auto; line-height: 1.55; }
#term-out a { color: #6cb6e0; }
#term-out .cmd { color: #8fd3ff; }
#term-out .err { color: #ff9c9c; }
#term-out .dim { color: #8b949e; }
#term-line { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.prompt { color: #7fd18c; white-space: nowrap; }
#term-in { flex: 1; background: transparent; border: none; outline: none; color: inherit; font: inherit; padding: 2px 0; caret-color: #7fd18c; }
</style>

<script>
(() => {
  const term = document.getElementById('term');
  const out = document.getElementById('term-out');
  const input = document.getElementById('term-in');
  const cmdHist = [];
  let hi = -1;

  const w = (html) => { const d = document.createElement('div'); d.innerHTML = html; out.appendChild(d); };
  const wt = (text, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); };

  const pages = {
    home:  { url: '/',                desc: 'profile, experience, projects, blog' },
    blog:  { url: '/blog/',           desc: 'writing (self-hosting, CV, etc.)' },
    certs: { url: '/certifications/', desc: 'full certification list' },
    chat:  { url: '/chat/',           desc: 'ask AI about Evan' },
    lab:   { url: '/lab/',            desc: 'live homelab status' },
    uses:  { url: '/uses/',           desc: 'hardware & software I use' },
  };

  const P = (t) => `<span class="dim">${t}</span>`;

  const commands = {
    help: () => w(
      'Available commands:\n' +
      '  help            this help\n' +
      '  whoami          who owns this site\n' +
      '  about           short summary\n' +
      '  experience      work experience\n' +
      '  projects        selected projects\n' +
      '  skills          core skills\n' +
      '  contact         contact info\n' +
      '  ls              list site pages\n' +
      '  cat &lt;page&gt;      page summary\n' +
      '  open &lt;page&gt;     open a page\n' +
      '  neofetch        "system" info\n' +
      '  clear           clear the screen'),
    whoami: () => w('evan — AI Engineer\nComputer Vision · ML · Backend · Semarang, Indonesia\n' + P('“Every day you may make progress.”')),
    about: () => w(
      'AI Engineer at rubythalib.ai, deployed to Sinarmas\n' +
      'Mining / PT Borneo Indobara for production AI in\n' +
      'mining safety operations.\n' +
      'Face recognition 0% → 97% · OCR 60% → 94%\n' +
      'Jetson RAM 24GB → 8GB'),
    experience: () => w(
      'AI Engineer        rubythalib.ai     May 2026 – now\n' +
      'AI Engineer Intern rubythalib.ai     Oct 2025 – Apr 2026\n' +
      'Research Assistant UNS Surakarta     Dec 2024 – Jul 2026\n' +
      'CV Engineer Intern DataIns           Dec 2024 – Apr 2025'),
    projects: () => w(
      'hireonai.web.id  AI job portal (founder)\n' +
      'dicodex          bootcamp analytics (1,000+ users)\n' +
      'visionai         CCTV analytics (clean architecture)\n' +
      'homelab          self-hosted infra (this site runs here)'),
    skills: () => w(
      'ML & Data      Python · Computer Vision · YOLO ·\n' +
      '               DeepFace · XGBoost · Time Series ·\n' +
      '               LLM & RAG · ChromaDB\n' +
      'Backend/Infra  FastAPI · Go · Node.js · Docker ·\n' +
      '               Linux · PostgreSQL/MySQL · CI/CD · GCP'),
    contact: () => w('email      <a href="mailto:evan.hanif.w@gmail.com">evan.hanif.w@gmail.com</a>\n' +
                     'linkedin   <a href="https://www.linkedin.com/in/evanhanif/" target="_blank" rel="noopener">linkedin.com/in/evanhanif</a>\n' +
                     'github     <a href="https://github.com/evanhfw" target="_blank" rel="noopener">github.com/evanhfw</a>'),
    ls: () => w(Object.entries(pages).map(([k, v]) => `  ${k.padEnd(9)} ${v.desc}`).join('\n')),
    cat: (arg) => {
      const p = pages[arg];
      return p ? w(`${arg}/  — ${p.desc}\n` + `open it with: open ${arg}`) : w(`no such page "${arg}" — try: ls`, 'err');
    },
    open: (arg) => {
      const p = pages[arg];
      if (p) { wt(`opening ${p.url} …`, 'dim'); setTimeout(() => { location.href = p.url; }, 350); }
      else w(`no such page "${arg}" — try: ls`, 'err');
    },
    neofetch: () => w(
      '    .---.      evan@hello\n' +
      '   / o o \\\\     -----------------------\n' +
      '   \\\\ _^_ /     host    : hello.evanhfw.my.id\n' +
      '    `---`      engine  : Jekyll + nginx (self-hosted)\n' +
      '               shell   : mini-shell v1\n' +
      '               uptime  : see /lab\n' +
      '               memory  : Honcho + Umami + more'),
    sudo: () => w('Nice try. 😄 ' + P("you're not root here")),
    exit: () => w("You can't log out — but you can go to " + '<a href="/">/</a>.'),
    ping: () => w('pong'),
    clear: () => { out.innerHTML = ''; },
  };

  function run(raw) {
    const line = raw.trim();
    wt('evan@hello:~$ ' + line, 'cmd');
    if (!line) return;
    const [cmd, ...rest] = line.split(/\s+/);
    const fn = commands[cmd.toLowerCase()];
    if (fn) { fn(rest.join(' ').toLowerCase()); }
    else { wt(`unknown command: ${cmd} — type help`, 'err'); }
    out.lastElementChild?.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = input.value;
      if (v.trim()) { cmdHist.push(v); hi = cmdHist.length; }
      run(v);
      input.value = '';
    } else if (e.key === 'ArrowUp') {
      if (hi > 0) { hi--; input.value = cmdHist[hi] || ''; e.preventDefault(); }
    } else if (e.key === 'ArrowDown') {
      if (hi < cmdHist.length - 1) { hi++; input.value = cmdHist[hi] || ''; }
      else { hi = cmdHist.length; input.value = ''; }
      e.preventDefault();
    }
  });
  term.addEventListener('click', () => input.focus());

  w('<span class="dim">mini-shell ready. Type `help` to get started.</span>');
  input.focus();
})();
</script>
