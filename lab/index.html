layout: default

<h2>🖥️ /lab — live homelab</h2>
<p>Situs ini jalan di homelab-ku sendiri (server rumah + VPS kecil, terhubung mesh VPN). Angka di bawah diambil live dan refresh tiap 30 detik.</p>

<div id="lab">memuat…</div>

<style>
.lab-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 14px 0; }
.lab-card { border: 1px solid rgba(128,128,128,.35); border-radius: 8px; padding: 10px 12px; background: rgba(128,128,128,.06); }
.lab-card .k { font-size: 12px; opacity: .75; margin-bottom: 4px; }
.lab-card .v { font-weight: 700; }
.lab-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.lab-table th, .lab-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid rgba(128,128,128,.3); }
.lab-table th { font-size: 12px; opacity: .75; text-transform: uppercase; letter-spacing: .04em; }
</style>

<script>
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d + ' hari ' + h + ' jam';
}
async function load() {
  const el = document.getElementById('lab');
  try {
    const r = await fetch('/api/lab');
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const n = d.node || {}, c = d.containers || {};
    const memPct = n.mem_total_mb ? Math.round(100 * (1 - n.mem_available_mb / n.mem_total_mb)) : null;
    el.innerHTML = `
      <div class="lab-cards">
        <div class="lab-card"><div class="k">Node · home server</div><div class="v">${n.cpu_count ?? '?'} CPU · load ${n.load1?.toFixed(2) ?? '?'}</div></div>
        <div class="lab-card"><div class="k">RAM terpakai</div><div class="v">${memPct != null ? memPct + '% (' + n.mem_available_mb + ' MB free)' : '?'}</div></div>
        <div class="lab-card"><div class="k">Uptime node</div><div class="v">${n.uptime_seconds ? fmtUptime(n.uptime_seconds) : '?'}</div></div>
        <div class="lab-card"><div class="k">Container Docker</div><div class="v">${c.running ?? '?'} running / ${c.total ?? '?'}</div></div>
      </div>
      <h3>Layanan</h3>
      <table class="lab-table">
        <thead><tr><th>Layanan</th><th>Status</th><th>Respons</th></tr></thead>
        <tbody>
          ${(d.checks || []).map(x => `<tr><td>${x.name}</td><td>${x.ok ? '🟢 up' : '🔴 down'}</td><td>${x.code || '—'} · ${x.ms} ms</td></tr>`).join('')}
        </tbody>
      </table>
      <p><small>diperbarui ${new Date(d.updated_at).toLocaleTimeString()} · auto-refresh 30s · data dari <code>/api/lab</code></small></p>`;
  } catch (e) {
    el.textContent = 'Gagal memuat data lab — coba refresh sebentar lagi.';
  }
}
load();
setInterval(load, 30000);
</script>
