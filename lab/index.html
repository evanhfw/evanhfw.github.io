<h2>🖥️ /lab — live homelab</h2>
<p>Four nodes: a mini-PC at home (24/7), a small public VPS, an STB running DNS + power control, and an on-demand workstation. Everything below is live and refreshes every 30 seconds.</p>

<div id="lab">loading…</div>

<style>
.lab-nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 10px; margin: 14px 0; }
.node { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; padding: 12px 14px; background: rgba(128,128,128,.06); }
.node.off { opacity: .65; }
.node .head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
.node .dot { width: 9px; height: 9px; border-radius: 50%; background: #c04848; display: inline-block; flex: none; }
.node.on .dot { background: #3fae62; }
.node .role { font-size: 12px; opacity: .7; }
.node .spec { font-size: 12.5px; opacity: .85; margin: 6px 0 4px; }
.node .nums { font-size: 12.5px; }
.node .err { font-size: 12px; color: #c04848; }
.lab-table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
.lab-table th, .lab-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid rgba(128,128,128,.3); }
.lab-table th { font-size: 12px; opacity: .75; text-transform: uppercase; letter-spacing: .04em; }
.lab-h { margin: 16px 0 4px; font-size: 15px; }
</style>

<script>
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d + 'd ' + h + 'h';
}
function nodeCard(n) {
  const nums = [];
  if (n.cpu_pct != null) nums.push('CPU ' + Math.round(n.cpu_pct) + '%');
  if (n.load1 != null) nums.push('load ' + n.load1.toFixed(2));
  if (n.mem_pct != null) nums.push('RAM ' + Math.round(n.mem_pct) + '%' + (n.mem_used_gb != null && n.mem_total_gb != null ? ' · ' + n.mem_used_gb + '/' + n.mem_total_gb + ' GB' : ''));
  if (n.disk_pct != null) nums.push('disk ' + Math.round(n.disk_pct) + '%' + (n.disk_used_gb != null && n.disk_total_gb != null ? ' · ' + n.disk_used_gb + '/' + n.disk_total_gb + ' GB' : ''));
  if (n.uptime_seconds) nums.push('up ' + fmtUptime(n.uptime_seconds));
  if (n.containers_running != null) nums.push(n.containers_running + ' containers');
  return '<div class="node ' + (n.online ? 'on' : 'off') + '">' +
    '<div class="head"><span class="dot"></span><b>' + n.label + '</b><span class="role">' + n.role + '</span></div>' +
    '<div class="spec">' + n.spec + '</div>' +
    (nums.length ? '<div class="nums">' + nums.join(' · ') + '</div>' : '') +
    (n.error ? '<div class="err">' + n.error + '</div>' : '') +
    '</div>';
}
async function load() {
  const el = document.getElementById('lab');
  try {
    const r = await fetch('/api/lab');
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const groups = {};
    for (const c of (d.checks || [])) (groups[c.host] = groups[c.host] || []).push(c);
    const order = ['z6', 'sumopod', 'armbian'];
    const tables = order.filter(function (h) { return groups[h]; }).map(function (h) {
      return '<div class="lab-h">' + h + '</div>' +
        '<table class="lab-table"><thead><tr><th>Service</th><th>Status</th><th>Response</th></tr></thead><tbody>' +
        groups[h].map(function (x) {
          return '<tr><td>' + x.name + '</td><td>' + (x.ok ? '🟢 up' : '🔴 down') + '</td><td>' + (x.code || '—') + ' · ' + x.ms + ' ms</td></tr>';
        }).join('') +
        '</tbody></table>';
    }).join('');
    el.innerHTML =
      '<div class="lab-nodes">' + (d.nodes || []).map(nodeCard).join('') + '</div>' +
      tables +
      '<p><small>updated ' + new Date(d.updated_at).toLocaleTimeString() +
      ' · auto-refresh 30s · the workstation is usually off (powered on only when heavy compute is needed)</small></p>';
  } catch (e) {
    el.textContent = 'Could not load lab data — try refreshing in a moment.';
  }
}
load();
setInterval(load, 30000);
</script>
